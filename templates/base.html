<!Doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}To-Do{% endblock %}</title>

  <!-- Bootstrap 4.6 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    .nav-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 8px;
    }
    .profile-small { display:flex; align-items:center; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="{% url 'tasks:index' %}">To-Do</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navMain"
            aria-controls="navMain" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav ml-auto">
        {% if user.is_authenticated %}
          <li class="nav-item">
            <a class="nav-link profile-small" href="{% url 'tasks:index' %}">
              {% if user.profile_image %}
                <img src="{{ user.profile_image.url }}" alt="avatar" class="nav-avatar">
              {% endif %}
              {{ user.username }}
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'tasks:logout' %}">LogOut</a>
          </li>
        {% else %}
          <li class="nav-item"><a class="nav-link" href="{% url 'tasks:login' %}">LogIn</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'tasks:registration' %}">Registration</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <!-- messages -->
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags }} alert-dismissible fade show" role="alert">
        {{ m }}
        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
          <span aria-hidden="true">times</span>
        </button>
      </div>
    {% endfor %}
  {% endif %}

  <!-- main content -->
  {% block content %}{% endblock %}
</div>

<footer class="text-center text-muted mt-5 mb-4">
  <small>Boss Extazz</small>
</footer>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
